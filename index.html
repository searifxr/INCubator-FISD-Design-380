<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Interior Customization Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CAR INTERIOR CUSTOMIZATION SIMULATOR</h1>
        </header>

        <div class="main-content">
            <!-- Car Type Selection -->
            <section class="car-selection">
                <h2>Select Car Type</h2>
                <div class="car-types">
                    <button class="car-type-btn active" data-type="sedan">
                        Sedan
                    </button>
                    <button class="car-type-btn" data-type="suv">
                        SUV
                    </button>
                    <button class="car-type-btn" data-type="truck">
                        Truck
                    </button>
                </div>
            </section>

            <div class="workspace">
                <!-- Component Library -->
                <aside class="component-library">
                    <h3>Components</h3>
                    <div class="components-list">
                        <div class="component-item" data-component="shelf">
                            <svg class="component-icon" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                                <rect x="5" y="10" width="90" height="10" fill="#555" stroke="#ffd700" stroke-width="2"/>
                                <rect x="10" y="20" width="5" height="20" fill="#444"/>
                                <rect x="85" y="20" width="5" height="20" fill="#444"/>
                            </svg>
                            <span>Shelf</span>
                        </div>
                        <div class="component-item" data-component="speaker">
                            <svg class="component-icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="40" cy="40" r="35" fill="#222" stroke="#ffd700" stroke-width="2"/>
                                <circle cx="40" cy="40" r="25" fill="#111" stroke="#555" stroke-width="1"/>
                                <circle cx="40" cy="40" r="15" fill="#333" stroke="#555" stroke-width="1"/>
                            </svg>
                            <span>Speaker</span>
                        </div>
                        <div class="component-item" data-component="storage-box">
                            <svg class="component-icon" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                                <rect x="10" y="10" width="80" height="60" fill="#333" stroke="#ffd700" stroke-width="2" rx="4"/>
                                <rect x="20" y="30" width="60" height="3" fill="#555"/>
                                <circle cx="50" cy="42" r="5" fill="#ffd700"/>
                            </svg>
                            <span>Storage Box</span>
                        </div>
                        <div class="component-item" data-component="cupholder">
                            <svg class="component-icon" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="30" cy="30" r="25" fill="#222" stroke="#ffd700" stroke-width="2"/>
                                <circle cx="30" cy="30" r="18" fill="#111"/>
                                <ellipse cx="30" cy="28" rx="16" ry="4" fill="#333"/>
                            </svg>
                            <span>Cup Holder</span>
                        </div>
                        <div class="component-item" data-component="screen">
                            <svg class="component-icon" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
                                <rect x="10" y="10" width="80" height="50" fill="#111" stroke="#ffd700" stroke-width="2" rx="3"/>
                                <rect x="15" y="15" width="70" height="40" fill="#1a3d5c"/>
                                <text x="50" y="40" font-size="12" fill="#ffd700" text-anchor="middle">SCREEN</text>
                            </svg>
                            <span>Display Screen</span>
                        </div>
                        <div class="component-item" data-component="minibar">
                            <svg class="component-icon" viewBox="0 0 90 50" xmlns="http://www.w3.org/2000/svg">
                                <rect x="5" y="5" width="80" height="40" fill="#2a2a2a" stroke="#ffd700" stroke-width="2" rx="3"/>
                                <circle cx="22" cy="25" r="6" fill="#0a0a0a" stroke="#555" stroke-width="1"/>
                                <circle cx="45" cy="25" r="6" fill="#0a0a0a" stroke="#555" stroke-width="1"/>
                                <circle cx="68" cy="25" r="6" fill="#0a0a0a" stroke="#555" stroke-width="1"/>
                            </svg>
                            <span>Mini Bar</span>
                        </div>
                    </div>
                </aside>

                <!-- Car Interior Canvas -->
                <main class="canvas-area">
                    <div class="car-interior-wrapper">
                        <!-- Car container with outline overlay -->
                        <div id="carContainer" class="car-container">
                            <!-- Car outline and fixed elements will be drawn by JS -->
                        </div>
                        
                        <!-- Drag preview -->
                        <div id="dragPreview" class="drag-preview"></div>
                        
                        <!-- Component menu (fixed position, rendered outside) -->
                    </div>
                    
                    <!-- Component menu -->
                    <div id="componentMenu" class="component-menu">
                        <button class="menu-btn" id="moveBtn" title="Move">✋</button>
                        <button class="menu-btn" id="rotateBtn" title="Rotate">↻</button>
                        <button class="menu-btn" id="deleteBtn" title="Delete">✕</button>
                    </div>

                    <div class="controls">
                        <button id="clearAll" class="btn-clear">Clear All</button>
                        <div class="info">
                            <span id="carTypeInfo">Current: Sedan</span>
                            <span id="componentCount">Components: 0</span>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
